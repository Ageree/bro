<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>bro — твой личный ИИ-агент</title>
  <meta name="description" content="bro — персональный ИИ-агент со своим номером, памятью и руками в интернете. Записать к врачу, забронировать, заказать — просто напиши ему." />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/assets/bro-mark.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/bro-logo.png" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="bro — твой личный ИИ-агент" />
  <meta property="og:description" content="Свой номер, своя память, свои руки в интернете. Записать к врачу, забронировать, заказать — просто напиши ему." />
  <meta property="og:image" content="/assets/bro-og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prata&family=Onest:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/brand.css" />
  <style>
    /* ---- login sheet ---- */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
    }
    .modal[hidden] { display: none; }
    .sheet {
      width: min(23rem, 100%);
      background: var(--paper);
      padding: 1.7rem 1.5rem 1.3rem;
      text-align: left;
    }
    .sheet h2 { font-family: var(--font-display); font-size: 1.35rem; margin-bottom: 0.6rem; }
    .sheet label { display: block; font-size: 0.8rem; color: var(--ink-mute); margin: 0.9rem 0 0.35rem; }
    .sheet input {
      width: 100%;
      font: inherit;
      padding: 0.7rem 0.8rem;
      border: 1px solid var(--ink);
      border-radius: 0;
      background: var(--paper);
      color: var(--ink);
    }
    .sheet input:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
    .sheet .sheet-cta { display: flex; width: 100%; margin-top: 1rem; white-space: nowrap; }
    .sheet .text-close {
      font-family: var(--font-display);
      display: block;
      width: 100%;
      margin-top: 0.85rem;
      background: none;
      border: 0;
      color: var(--ink-mute);
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: center;
    }
    .sheet .status { min-height: 1.3rem; margin-top: 0.7rem; color: var(--ink-mute); font-size: 0.86rem; line-height: 1.4; }
  </style>
</head>
<body>

  <section class="stage">
    <header class="stage__bar">
      <div><a class="link t-nav" href="/oferta.html">Оферта</a></div>
      <a class="link t-wordmark" href="/">bro.</a>
      <div>
        <a class="link t-nav" id="cabinet-open" href="/cabinet.html" hidden>Кабинет</a>
        <a class="link t-nav" id="vault-open" href="/vault.html" hidden>Сейф</a>
        <button class="link t-nav" id="logout" type="button" style="background:none;border:0;cursor:pointer" hidden>Выйти</button>
        <button class="link t-nav" id="login-open" type="button" style="background:none;border:0;cursor:pointer">Войти</button>
      </div>
    </header>

    <div class="stage__film">
      <!-- `contain`, not `cover`: the figure is shown whole at every viewport,
           never cropped at the head or the feet. The clip is shot on the same
           white as the page, so the letterboxing either side of a 9:16 frame
           is invisible. It carries no audio track, so there is no sound
           control to offer. -->
      <video class="stage__video" src="/assets/hero-portrait.mp4"
             playsinline muted loop autoplay preload="auto" aria-hidden="true"></video>
    </div>

    <div class="stage__foot">
      <a class="link t-cta" id="request-access" data-request-access href="#">Получить своего бро</a>
    </div>
  </section>

  <div class="modal" id="login-modal" hidden>
    <div class="sheet" role="dialog" aria-labelledby="login-title">
      <h2 id="login-title">Вход в кабинет</h2>
      <p class="t-small t-mute">На компьютере введи handle. Код придёт сообщением от Bro в уже открытый чат iMessage.</p>
      <div id="login-handle-row" hidden>
        <label for="login-handle">Handle</label>
        <input id="login-handle" autocomplete="username" placeholder="bro-xxxxxxxx" />
      </div>
      <button class="btn sheet-cta" id="login-send" type="button">Получить код</button>
      <div id="login-code-row" hidden>
        <label for="login-code">Код из iMessage</label>
        <input id="login-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
        <button class="btn sheet-cta" id="login-verify" type="button">Войти</button>
      </div>
      <p class="status" id="login-status"></p>
      <button class="text-close" id="login-cancel" type="button">Закрыть</button>
    </div>
  </div>

  <script>
    /* The clip's white is not the page's white. It drifts between roughly #e7
       and #fc from one character to the next, so any fixed page colour leaves a
       visible seam around the letterboxed frame.

       Correcting the video was the other option and it is not available: several
       characters wear clothing at the same brightness as their own background,
       so any curve that whitens the background dissolves the shirt with it —
       tried, and the man in the white shirt disappeared.

       So the page follows the film instead: sample the corner of the current
       frame, which is always background, and make the page that exact colour. */
    (function () {
      var v = document.querySelector(".stage__video");
      if (!v || !window.requestAnimationFrame) return;

      var c = document.createElement("canvas");
      c.width = c.height = 1;
      var ctx = c.getContext && c.getContext("2d", { willReadFrequently: true });
      if (!ctx) return;

      var root = document.documentElement;
      var last = "";
      var next = 0;

      function sample(now) {
        if (v.readyState >= 2 && now >= next) {
          next = now + 120;              /* eight reads a second catches every cut */
          try {
            ctx.drawImage(v, 6, 6, 40, 40, 0, 0, 1, 1);
            var d = ctx.getImageData(0, 0, 1, 1).data;
            var rgb = "rgb(" + d[0] + "," + d[1] + "," + d[2] + ")";
            if (rgb !== last) {
              last = rgb;
              root.style.setProperty("--paper", rgb);
            }
          } catch (e) {
            return;                      /* tainted canvas: keep the default white */
          }
        }
        requestAnimationFrame(sample);
      }

      requestAnimationFrame(sample);
    })();
  </script>

  <script src="assets/config.js"></script>
  <script src="assets/auth.js"></script>
  <script>
    (function () {
      var KEY = "bro.handle";
      var ctas = [].slice.call(document.querySelectorAll("[data-request-access]"));
      if (!ctas.length) return;

      function isIos() {
        var ua = navigator.userAgent || "";
        if (/iPhone|iPad|iPod/i.test(ua)) return true;
        return navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
      }

      function site() {
        var s = window.BRO_CONVEX_SITE_URL;
        return typeof s === "string" ? s.replace(/\/$/, "") : "";
      }

      /* Every CTA on the page shows the same state, so a person who scrolled
         past the hero still sees why nothing happened. */
      function setLabel(t) {
        ctas.forEach(function (el) { el.textContent = t; });
      }

      function onClick(e) {
        var cta = e.currentTarget;
        e.preventDefault();
        if (cta.getAttribute("aria-busy") === "true") return;

        var base = site();
        if (!base) {
          setLabel("Сайт ещё не подключён");
          return;
        }

        if (!isIos() && !localStorage.getItem(KEY)) {
          setLabel("Открой на iPhone");
          return;
        }

        cta.setAttribute("aria-busy", "true");
        setLabel("Создаём…");
        var handle = localStorage.getItem(KEY) || undefined;
        fetch(base + "/access", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(handle ? { handle: handle } : {}),
        })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (!data.ok) {
              if (data.code === "not_ios") setLabel("Открой на iPhone");
              else if (data.code === "closed") setLabel("Пока закрыто");
              else setLabel("Не вышло, нажми ещё раз");
              return;
            }
            localStorage.setItem(KEY, data.handle);
            if (data.sessionToken && window.broStoreSession) {
              window.broStoreSession(data.handle, data.sessionToken);
            }
            window.location.href = data.smsLink;
          })
          .catch(function () {
            setLabel("Не вышло, нажми ещё раз");
          })
          .then(function () {
            cta.removeAttribute("aria-busy");
          });
      }

      ctas.forEach(function (el) { el.addEventListener("click", onClick); });
    })();
  </script>
</body>
</html>
