<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>bro — сейф</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/assets/bro-mark.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/bro-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prata&family=Onest:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/brand.css" />
  <style>
    /* the vault is the one page that is mostly a form, so its fields sit
       tighter than the cabinet's single select */
    .sec .form > .field { margin-bottom: 0.2rem; }
    .flash { border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 0.9rem 0; margin-top: 1.6rem; font-size: 0.95rem; line-height: 1.5; }
  </style>
</head>
<body>

  <header class="bar">
    <div><a class="link t-nav" id="cabinet-open" href="/cabinet.html">Кабинет</a></div>
    <a class="link t-wordmark" href="/">bro.</a>
    <div>
      <button class="link t-nav" id="logout" type="button" style="background:none;border:0;cursor:pointer">Выйти</button>
      <button class="link t-nav" id="login-open" type="button" style="background:none;border:0;cursor:pointer" hidden>Войти</button>
    </div>
  </header>

  <div class="modal" id="login-modal" hidden>
    <div class="sheet" role="dialog" aria-labelledby="login-title">
      <h2 id="login-title">Вход</h2>
      <p class="t-small t-mute" id="login-hint">Сначала напиши Bro в iMessage.</p>
      <div id="login-handle-row" hidden>
        <label for="login-handle">Bro</label>
        <input id="login-handle" autocomplete="username" />
      </div>
      <button class="btn sheet-cta" id="login-send" type="button">Написать Bro</button>
      <div id="login-code-row" hidden>
        <label for="login-code">Код</label>
        <input id="login-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
        <button class="btn sheet-cta" id="login-verify" type="button">Войти</button>
      </div>
      <p class="status" id="login-status"></p>
      <button class="text-close" id="login-cancel" type="button">Закрыть</button>
    </div>
  </div>

  <main class="doc">
    <h1 class="doc-title">Сейф</h1>
    <p class="t-small t-mute" id="boot">Загружаем…</p>
    <div id="body" hidden>
      <p class="t-small t-mute">Bro не видит эти значения — модель их не получает. Они нужны только чтобы заполнить форму в браузере.</p>
      <p class="flash" id="flash" hidden></p>

      <section class="sec">
        <div class="sec__head"><h2>Сохранённые</h2></div>
        <ul class="rows" id="items"></ul>
        <p class="t-small t-mute" id="items-empty">Пока пусто.</p>
      </section>

      <section class="sec">
        <div class="sec__head"><h2>Добавить</h2></div>
        <form class="form" id="add-form" autocomplete="off" method="post">
          <label for="kind">Тип</label>
          <select class="field" id="kind">
            <option value="login">вход</option>
            <option value="payment">карта</option>
            <option value="address">адрес</option>
            <option value="contact">контакт</option>
          </select>

          <label for="label">Метка</label>
          <input class="field" id="label" maxlength="120" autocomplete="off" placeholder="Wildberries" />

          <div id="fields-login">
            <label for="login-origin">Сайт</label>
            <input class="field" id="login-origin" autocomplete="off" placeholder="https://www.wildberries.ru" />

            <label for="login-ident-type">Тип логина</label>
            <select class="field" id="login-ident-type">
              <option value="email">почта</option>
              <option value="phone">телефон</option>
              <option value="username">логин</option>
            </select>

            <label for="login-ident">Логин</label>
            <input class="field" id="login-ident" autocomplete="off" />

            <label>Как входить</label>
            <div class="choice">
              <label><input type="radio" name="login-auth" value="password" checked /> пароль</label>
              <label><input type="radio" name="login-auth" value="email_otp" /> код из почты</label>
              <label><input type="radio" name="login-auth" value="sms_otp" /> код из СМС</label>
            </div>
            <div id="login-password-row">
              <label for="login-password">Пароль</label>
              <input class="field" id="login-password" type="password" autocomplete="off" />
            </div>
          </div>

          <div id="fields-payment" hidden>
            <label for="pay-name">Имя на карте</label>
            <input class="field" id="pay-name" autocomplete="off" />

            <label for="pay-number">Номер карты</label>
            <input class="field" id="pay-number" inputmode="numeric" autocomplete="off" />

            <div class="pair">
              <div>
                <label for="pay-month">Месяц</label>
                <input class="field" id="pay-month" inputmode="numeric" maxlength="2" autocomplete="off" placeholder="12" />
              </div>
              <div>
                <label for="pay-year">Год</label>
                <input class="field" id="pay-year" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="2028" />
              </div>
            </div>

            <label for="pay-cvv">CVV</label>
            <input class="field" id="pay-cvv" type="password" inputmode="numeric" maxlength="4" autocomplete="off" />

            <label for="pay-postal">Индекс (необязательно)</label>
            <input class="field" id="pay-postal" autocomplete="off" />
          </div>

          <div id="fields-address" hidden>
            <label for="addr-name">Получатель</label>
            <input class="field" id="addr-name" autocomplete="off" />

            <label for="addr-line1">Улица</label>
            <input class="field" id="addr-line1" autocomplete="off" />

            <label for="addr-line2">Квартира, офис (необязательно)</label>
            <input class="field" id="addr-line2" autocomplete="off" />

            <label for="addr-city">Город</label>
            <input class="field" id="addr-city" autocomplete="off" />

            <label for="addr-region">Регион (необязательно)</label>
            <input class="field" id="addr-region" autocomplete="off" />

            <label for="addr-postal">Индекс (необязательно)</label>
            <input class="field" id="addr-postal" autocomplete="off" />

            <label for="addr-country">Страна</label>
            <input class="field" id="addr-country" maxlength="2" autocomplete="off" value="RU" />
          </div>

          <div id="fields-contact" hidden>
            <label for="contact-name">Имя</label>
            <input class="field" id="contact-name" autocomplete="off" />

            <label for="contact-email">Почта</label>
            <input class="field" id="contact-email" type="email" autocomplete="off" />

            <label for="contact-phone">Телефон</label>
            <input class="field" id="contact-phone" autocomplete="off" />
          </div>

          <div class="acts"><button class="btn" id="save" type="button">Сохранить</button></div>
          <p class="err" id="form-error"></p>
        </form>
      </section>
    </div>
  </main>

  <script src="assets/config.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/vault.js"></script>
</body>
</html>
