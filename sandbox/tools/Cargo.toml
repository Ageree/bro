[package]
name = "bro-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "CLI `tools` inside Bro's sandbox: GraphQL client to the tool broker over a unix socket"
publish = false

[[bin]]
name = "tools"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
