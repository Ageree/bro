name: E2E

# The browser suite (docs/e2e.md): `next dev` against a throwaway Postgres,
# driven by the e2e runner; Bro and the runner's agent steps both answer
# through OpenRouter with the OPENROUTER_API_KEY secret.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "browser-vm/**"
      - "sandbox/**"
  push:
    branches:
      - bro-next
  schedule:
    # Nightly on bro-next: the model and its hosts change without a commit.
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (browser)
    # A fork's pull request gets no secrets: Bro could not answer.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      # The github() reporter keeps one comment per pull request.
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # A throwaway database reachable only from this job: no password.
          POSTGRES_DB: bro_e2e
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bro_e2e"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      E2E_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/bro_e2e
      E2E_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Migrate the database
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ env.E2E_DATABASE_URL }}

      - name: Run the suite
        run: pnpm test:e2e --reporter list,junit,markdown
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            .e2e/report.json
            .e2e/junit.xml
            .e2e/summary.md
            .e2e/failures/
            .e2e/artifacts/
            .e2e/logs/
          retention-days: 14
          if-no-files-found: ignore
