name: Checks

on:
  pull_request:
  push:
    branches:
      - bro-next
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

  browser-vm:
    name: Browser host and worker (Python)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # The sandbox's worker runs on 3.11; hostd's tests also run on the host's 3.10.
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install aiohttp cryptography

      - name: Pool host (hostd, boot)
        working-directory: browser-vm/host
        run: python -m unittest

      - name: Sandbox image and init
        working-directory: browser-vm/image
        run: python -m unittest

      - name: Worker
        working-directory: browser-vm/worker
        run: python -m unittest

  code-sandbox:
    name: Code sandbox (Go, Rust, host)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: sandbox/sandboxd/go.mod
          cache: false

      - name: sandboxd (fake runsc)
        working-directory: sandbox/sandboxd
        run: go vet ./... && go test ./...

      - name: tools CLI
        working-directory: sandbox/tools
        run: cargo test --locked

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # The code host runs Ubuntu 22.04's Python 3.10.
          python-version: "3.10"

      - name: Telegram egress of the app host (tg-egress)
        working-directory: scripts/cloudru-app-host/tg-egress
        run: python -m unittest

      - name: Code host (boot, provision)
        working-directory: sandbox/host
        run: python -m unittest

      # Releases are tar.zst: deployd's release tests unpack real archives and fail without zstd.
      - name: Install zstd
        run: command -v zstd || (sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd)

      - name: App host (deployd, watchdog, boot)
        working-directory: scripts/cloudru-app-host/host
        run: python -m unittest
