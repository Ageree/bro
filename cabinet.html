<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>bro — кабинет</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #17271e;
      --ink-soft: #3c4d43;
      --cta-bg: #17271e;
      --cta-fg: #f6faf5;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow-x: hidden; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    .bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        url("assets/meadow.webp") center / cover no-repeat,
        linear-gradient(180deg, #dff0fb 0%, #eaf6ec 45%, #bfe3c4 100%);
    }
    .scrim {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(ellipse 70% 55% at 50% 42%,
        rgba(255, 255, 255, 0.62) 0%,
        rgba(255, 255, 255, 0.28) 45%,
        rgba(255, 255, 255, 0) 72%);
    }
    .topbar {
      position: fixed;
      top: 0; right: 0; left: 0;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.3rem;
    }
    .word {
      font-weight: 600;
      font-size: 1.2rem;
      letter-spacing: -0.03em;
      text-decoration: none;
      color: var(--ink);
    }
    .topbar-actions { display: flex; gap: 0.6rem; }
    .ghost {
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(23, 39, 30, 0.18);
      color: var(--ink);
      font: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
      padding: 0.5rem 1.15rem;
      border-radius: 999px;
      cursor: pointer;
    }
    .cta {
      display: inline-block;
      background: var(--cta-bg);
      color: var(--cta-fg);
      font: inherit;
      font-size: 1rem;
      font-weight: 500;
      text-decoration: none;
      padding: 0.75rem 1.6rem;
      border-radius: 999px;
      border: 0;
      cursor: pointer;
    }
    .wrap {
      max-width: 40rem;
      margin: 0 auto;
      padding: 6rem 1.5rem 4rem;
    }
    h1 {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      letter-spacing: -0.03em;
      margin-bottom: 1.4rem;
    }
    .card {
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid rgba(23, 39, 30, 0.12);
      border-radius: 1.2rem;
      padding: 1.4rem 1.5rem;
      margin-bottom: 1rem;
    }
    .card h2 { font-size: 1.02rem; margin-bottom: 0.7rem; }
    .cmd {
      display: block;
      margin: 0.8rem 0;
      padding: 0.75rem 0.9rem;
      border-radius: 0.75rem;
      background: #17271e;
      color: #f6faf5;
      font: 0.78rem/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.8rem; }
    .row input,
    .row select {
      flex: 1 1 12rem;
      min-width: 0;
      font: inherit;
      padding: 0.55rem 0.7rem;
      border-radius: 0.7rem;
      border: 1px solid rgba(23, 39, 30, 0.18);
      background: #fff;
    }
    .muted { color: var(--ink-soft); font-size: 0.95rem; line-height: 1.5; }
    .handle-xl {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 0.55rem;
    }
    .memos { list-style: none; }
    .memos li {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.8rem;
      padding: 0.55rem 0;
      border-top: 1px solid rgba(23, 39, 30, 0.08);
    }
    .memos li:first-child { border-top: 0; }
    .memo-line { flex: 1; min-width: 0; word-break: break-word; line-height: 1.45; }
    .memo-forget { font-size: 0.88rem; padding: 0.4rem 0.9rem; flex-shrink: 0; }
    .bar {
      height: 0.45rem;
      background: rgba(23, 39, 30, 0.1);
      border-radius: 999px;
      overflow: hidden;
      margin: 0.45rem 0 0.9rem;
    }
    .bar > i {
      display: block;
      height: 100%;
      background: #17271e;
    }
    .pay { list-style: none; }
    .pay li { padding: 0.35rem 0; border-top: 1px solid rgba(23, 39, 30, 0.08); }
    .pay li:first-child { border-top: 0; }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(23, 39, 30, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
    }
    .modal[hidden] { display: none; }
    .sheet {
      width: min(24rem, 100%);
      background: rgba(255, 255, 255, 0.94);
      border-radius: 1.2rem;
      padding: 1.6rem 1.5rem 1.35rem;
    }
    .sheet h2 { font-size: 1.15rem; margin-bottom: 0.45rem; }
    .sheet .hint {
      color: var(--ink-soft);
      font-size: 0.9rem;
      line-height: 1.45;
      margin-bottom: 0.35rem;
    }
    .sheet label { display: block; font-size: 0.85rem; margin: 0.75rem 0 0.3rem; }
    .sheet input {
      width: 100%;
      font: inherit;
      padding: 0.7rem 0.8rem;
      border-radius: 0.7rem;
      border: 1px solid rgba(23, 39, 30, 0.2);
    }
    .sheet .sheet-cta {
      display: block;
      width: 100%;
      margin-top: 1rem;
      text-align: center;
      white-space: nowrap;
      border: 0;
      cursor: pointer;
    }
    .sheet .text-close {
      display: block;
      width: 100%;
      margin-top: 0.85rem;
      background: none;
      border: 0;
      color: var(--ink-soft);
      font: inherit;
      font-size: 0.92rem;
      cursor: pointer;
      text-align: center;
    }
    .sheet .status { min-height: 1.3rem; margin-top: 0.7rem; color: var(--ink-soft); font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>

  <header class="topbar">
    <a class="word" href="/">bro</a>
    <div class="topbar-actions">
      <a class="ghost" id="cabinet-open" href="/cabinet.html">Кабинет</a>
      <button class="ghost" id="logout" type="button">Выйти</button>
      <button class="ghost" id="login-open" type="button" hidden>Войти</button>
    </div>
  </header>

  <div class="modal" id="login-modal" hidden>
    <div class="sheet" role="dialog" aria-labelledby="login-title">
      <h2 id="login-title">Вход в кабинет</h2>
      <p class="hint">На компьютере введи handle. Код придёт сообщением от Bro в уже открытый чат iMessage.</p>
      <div id="login-handle-row" hidden>
        <label for="login-handle">Handle</label>
        <input id="login-handle" autocomplete="username" placeholder="bro-xxxxxxxx" />
      </div>
      <button class="cta sheet-cta" id="login-send" type="button">Получить код</button>
      <div id="login-code-row" hidden>
        <label for="login-code">Код из iMessage</label>
        <input id="login-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
        <button class="cta sheet-cta" id="login-verify" type="button">Войти</button>
      </div>
      <p class="status" id="login-status"></p>
      <button class="text-close" id="login-cancel" type="button">Закрыть</button>
    </div>
  </div>

  <main class="wrap">
    <h1>Кабинет</h1>
    <p class="muted" id="boot">Загружаем…</p>
    <div id="body" hidden></div>
  </main>

  <script src="assets/config.js"></script>
  <script src="assets/auth.js"></script>
  <script>
    (function () {
      var TOKEN = "bro.session";
      function site() {
        var s = window.BRO_CONVEX_SITE_URL;
        return typeof s === "string" ? s.replace(/\/$/, "") : "";
      }
      function token() { return localStorage.getItem(TOKEN) || ""; }
      function esc(s) {
        return String(s).replace(/[&<>"]/g, function (c) {
          return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c];
        });
      }
      function pct(used, allow) {
        if (!allow) return 0;
        return Math.max(0, Math.min(100, Math.round((used / allow) * 100)));
      }
      var DEFAULT_TZ = "Europe/Moscow";
      var TZ_LIST = [
        "Europe/Moscow",
        "Europe/Samara",
        "Asia/Yekaterinburg",
        "Asia/Omsk",
        "Asia/Krasnoyarsk",
        "Asia/Irkutsk",
        "Asia/Yakutsk",
        "Asia/Vladivostok",
        "Asia/Magadan",
        "Asia/Kamchatka",
        "UTC",
      ];
      function zoneOf(me) {
        return (me && me.tz) || DEFAULT_TZ;
      }
      function when(ms, tz) {
        var zone = tz || DEFAULT_TZ;
        try {
          return new Date(ms).toLocaleString("ru-RU", { timeZone: zone });
        } catch (e) {
          return new Date(ms).toLocaleString("ru-RU", { timeZone: DEFAULT_TZ });
        }
      }
      function safeHttpUrl(u) {
        try {
          var x = new URL(u);
          if (x.protocol === "https:" || x.protocol === "http:") return x.toString();
        } catch (e) {}
        return "";
      }
      function tzOptions(current) {
        var list = TZ_LIST.slice();
        if (current && list.indexOf(current) === -1) list.push(current);
        return list.map(function (z) {
          return '<option value="' + esc(z) + '"' +
            (z === current ? " selected" : "") + ">" + esc(z) + "</option>";
        }).join("");
      }
      function computerStateRu(s) {
        if (!s || s === "none") return "нет компьютера";
        if (s === "pending") return "создаём";
        if (s === "ready" || s === "idle" || s === "running") return "работает";
        if (s === "archived" || s === "stopped" || s === "archiving") return "выключен";
        return s;
      }
      function chatgptStatusRu(s) {
        if (s === "connected") return "подключён";
        if (s === "pending") return "ждём вход";
        if (s === "quarantined") return "нужно войти снова";
        return "не подключён";
      }
      function computerCard(me) {
        var c = me.computer || { state: "none" };
        return '<div class="card" id="computer"><h2>Компьютер</h2>' +
          "<p>" + esc(computerStateRu(c.state)) + "</p>" +
          '<div class="row">' +
          '<button class="cta" id="computer-wake" type="button">Разбудить</button>' +
          '<button class="ghost" id="computer-stop" type="button">Выключить</button>' +
          '<button class="ghost" id="computer-wipe" type="button">Стереть диск</button>' +
          "</div>" +
          '<p class="muted" id="computer-status"></p></div>';
      }
      function chatgptCard(me) {
        var g = me.chatgpt || { status: "none" };
        var bits = "<p>" + esc(chatgptStatusRu(g.status)) + "</p>";
        if (g.email) bits += '<p class="muted">' + esc(g.email) + "</p>";
        if (g.planType) bits += '<p class="muted">' + esc(g.planType) + "</p>";
        bits += '<div class="row">';
        if (g.status !== "connected") {
          bits += '<button class="cta" id="chatgpt-connect" type="button">Подключить</button>';
        }
        if (g.status === "connected" || g.status === "quarantined" || g.status === "pending") {
          bits += '<button class="ghost" id="chatgpt-disconnect" type="button">Отключить</button>';
        }
        bits += "</div>" +
          '<p class="muted" id="chatgpt-status"></p>' +
          '<p class="cmd" id="chatgpt-code" hidden></p>';
        return '<div class="card" id="chatgpt"><h2>ChatGPT</h2>' + bits + "</div>";
      }
      function nowCard(me) {
        var job = me.browserJob || { status: "", label: "Сейчас ничего не делает" };
        var live = safeHttpUrl(job.liveUrl || "");
        var bits = '<p>' + esc(job.label) + "</p>";
        if (job.task) bits += '<p class="muted">' + esc(job.task) + "</p>";
        if (job.startedAt) {
          bits += '<p class="muted">' + esc(when(job.startedAt, zoneOf(me))) + "</p>";
        }
        if (live) {
          bits += '<div class="row"><a class="cta" id="browser-live" href="' +
            esc(live) + '" target="_blank" rel="noopener noreferrer">Открыть</a></div>';
        }
        return '<div class="card" id="now"><h2>Сейчас</h2>' + bits + "</div>";
      }
      function tzCard(me) {
        var zone = zoneOf(me);
        return '<div class="card" id="tz"><h2>Часовой пояс</h2>' +
          '<p class="muted">Сейчас: ' + esc(zone) + "</p>" +
          '<div class="row"><select id="tz-select" aria-label="Часовой пояс">' +
          tzOptions(zone) + "</select></div>" +
          '<p class="muted" id="tz-status"></p></div>';
      }
      function statusRu(s) {
        if (s === "succeeded") return "оплачен";
        if (s === "pending") return "ожидает";
        return "отменён";
      }
      function profileStatusRu(s, domains) {
        if (s === "synced" && domains && domains.length) {
          return "Сохранены входы: " + esc(domains.join(", "));
        }
        return "Пока нет сохранённых входов — Bro пришлёт ссылку, когда понадобится.";
      }

      var HANDLE = "bro.handle";
      var boot = document.getElementById("boot");
      var body = document.getElementById("body");
      var t = token();
      var base = site();
      var memoLines = [];
      if (!t) {
        boot.textContent = "Войди, чтобы увидеть оплату и лимиты.";
        document.getElementById("login-open").click();
        return;
      }
      if (!base) {
        boot.textContent = "Сайт ещё не подключён";
        return;
      }

      function validHandle(h) {
        return /^bro-[a-z0-9]{8}$/.test(h || "");
      }
      function storedHandle() {
        var h = (localStorage.getItem(HANDLE) || "").trim();
        return validHandle(h) ? h : "";
      }

      function memoCard(me) {
        memoLines = me.memories || [];
        var items = memoLines.map(function (line, i) {
          return '<li><span class="memo-line">' + esc(line) + "</span>" +
            '<button class="ghost memo-forget" type="button" data-i="' + i +
            '">Забыть</button></li>';
        }).join("");
        var empty = me.phoneBound
          ? "Пока пусто."
          : "Память появится, когда напишешь Bro в iMessage.";
        return '<div class="card" id="memory"><h2>Память</h2>' +
          (items
            ? '<ul class="memos" id="memos">' + items + "</ul>"
            : '<p class="muted">' + empty + "</p>") +
          '<p class="muted" id="memory-status"></p></div>';
      }

      function bindPay() {
        var btn = document.getElementById("pay-now");
        if (!btn) return;
        btn.addEventListener("click", function () {
          var st = document.getElementById("pay-status");
          st.textContent = "Открываем ЮKassa…";
          fetch(base + "/me/pay", {
            method: "POST",
            headers: { Authorization: "Bearer " + t },
          })
            .then(function (res) { return res.json(); })
            .then(function (data) {
              if (data.ok && data.confirmationUrl) {
                window.location.href = data.confirmationUrl;
                return;
              }
              if (data.code === "billing_off") st.textContent = "Оплата скоро";
              else st.textContent = "Не вышло, нажми ещё раз";
            })
            .catch(function () {
              st.textContent = "Не вышло, нажми ещё раз";
            });
        });
      }

      function bindWrite(me) {
        var btn = document.getElementById("write-bro");
        if (!btn) return;
        btn.addEventListener("click", function () {
          var st = document.getElementById("write-status");
          var h = storedHandle() || (validHandle(me.handle) ? me.handle : "");
          if (h && !storedHandle()) localStorage.setItem(HANDLE, h);
          if (!h) {
            st.textContent = "Открой сайт на том же iPhone или нажми «Запросить доступ» ещё раз.";
            return;
          }
          if (btn.getAttribute("aria-busy") === "true") return;
          btn.setAttribute("aria-busy", "true");
          st.textContent = "Открываем Messages…";
          fetch(base + "/access", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ handle: h }),
          })
            .then(function (res) { return res.json(); })
            .then(function (data) {
              if (data.ok && data.smsLink) {
                window.location.href = data.smsLink;
                return;
              }
              st.textContent = "Не вышло, нажми ещё раз";
            })
            .catch(function () {
              st.textContent = "Не вышло, нажми ещё раз";
            })
            .then(function () {
              btn.removeAttribute("aria-busy");
            });
        });
      }

      function bindTz() {
        var sel = document.getElementById("tz-select");
        if (!sel) return;
        sel.addEventListener("change", function () {
          var tz = sel.value;
          var st = document.getElementById("tz-status");
          st.textContent = "Сохраняем…";
          fetch(base + "/me/tz", {
            method: "POST",
            headers: {
              Authorization: "Bearer " + t,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ tz: tz }),
          })
            .then(function (res) { return res.json(); })
            .then(function (data) {
              if (!data.ok) {
                st.textContent = "Не вышло, нажми ещё раз";
                return;
              }
              return loadMe().then(function (me) {
                if (!me) return;
                paint(me);
              });
            })
            .catch(function () {
              st.textContent = "Не вышло, нажми ещё раз";
            });
        });
      }

      function bindForget() {
        var list = document.getElementById("memos");
        if (!list) return;
        list.addEventListener("click", function (e) {
          var el = e.target;
          if (!el || !el.closest) return;
          var btn = el.closest(".memo-forget");
          if (!btn) return;
          var i = Number(btn.getAttribute("data-i"));
          var needle = memoLines[i];
          if (!needle) return;
          var st = document.getElementById("memory-status");
          st.textContent = "Забываем…";
          fetch(base + "/me/memories/forget", {
            method: "POST",
            headers: {
              Authorization: "Bearer " + t,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ needle: needle }),
          })
            .then(function (res) { return res.json(); })
            .then(function (data) {
              if (!data.ok) {
                st.textContent = "Не вышло, нажми ещё раз";
                return;
              }
              return loadMe().then(function (me) {
                if (!me) return;
                paint(me);
              });
            })
            .catch(function () {
              st.textContent = "Не вышло, нажми ещё раз";
            });
        });
      }

      function paint(me) {
        var zone = zoneOf(me);
        var plan = me.plan === "paid" ? "Полный доступ" : "Бесплатный режим";
        var until = me.paidUntil
          ? "до " + when(me.paidUntil, zone)
          : "оплата ещё не оформлена";
        var phone = me.phoneBound
          ? "телефон …" + esc(me.phoneLast4 || "")
          : "телефон ещё не привязан — напиши Bro в iMessage";
        var pays = (me.payments || []).map(function (p) {
          return "<li>" + esc(when(p.createdAt, zone)) + " · " + esc(p.amountRub) +
            " ₽ · " + statusRu(p.status) + "</li>";
        }).join("");
        body.innerHTML =
          '<div class="card"><p class="handle-xl">' + esc(me.handle) + "</p>" +
          '<p class="muted">' + esc(plan) + " · " + phone + "</p>" +
          '<p class="muted">' + until + "</p>" +
          '<div class="row">' +
          '<button class="cta" id="write-bro" type="button">Написать Bro</button>' +
          '<button class="cta" id="pay-now" type="button">Оплатить месяц</button>' +
          "</div>" +
          '<p class="muted" id="write-status"></p>' +
          '<p class="muted" id="pay-status"></p></div>' +
          nowCard(me) +
          computerCard(me) +
          chatgptCard(me) +
          '<div class="card"><h2>Лимиты</h2>' +
          '<p class="muted">Сообщения сегодня: ' + me.msgsUsed + " из " + me.msgsAllowance + "</p>" +
          '<div class="bar"><i style="width:' + pct(me.msgsUsed, me.msgsAllowance) + '%"></i></div>' +
          '<p class="muted">Браузер-задачи в этом месяце: ' + me.browserUsed + " из " + me.browserAllowance + "</p>" +
          '<div class="bar"><i style="width:' + pct(me.browserUsed, me.browserAllowance) + '%"></i></div></div>' +
          memoCard(me) +
          '<div class="card" id="chrome"><h2>Входы в сайты</h2>' +
          '<p class="muted">Когда Bro нужна твоя учётка, он сам пришлёт ссылку в чат. Открой, войди — пароль он не увидит, вход сохранится.</p>' +
          '<p style="margin-top:0.7rem">' + profileStatusRu(me.browserProfileStatus, me.browserCookieDomains) + "</p></div>" +
          tzCard(me) +
          '<div class="card"><h2>Оплаты</h2>' +
          (pays ? '<ul class="pay">' + pays + "</ul>" : '<p class="muted">Пока нет оплат.</p>') +
          "</div>";
        boot.hidden = true;
        body.hidden = false;
        bindWrite(me);
        bindPay();
        bindForget();
        bindTz();
        bindComputer();
        bindChatgpt();
      }

      function bindComputer() {
        function post(action, label) {
          var st = document.getElementById("computer-status");
          if (action === "wipe" && !window.confirm("Стереть диск компьютера? Это нельзя отменить.")) {
            return;
          }
          st.textContent = label;
          fetch(base + "/me/computer", {
            method: "POST",
            headers: {
              Authorization: "Bearer " + t,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ action: action }),
          })
            .then(function (res) { return res.json(); })
            .then(function (data) {
              if (!data.ok) {
                st.textContent = "Не вышло, нажми ещё раз";
                return;
              }
              return loadMe().then(function (me) {
                if (!me) return;
                paint(me);
              });
            })
            .catch(function () {
              st.textContent = "Не вышло, нажми ещё раз";
            });
        }
        var wake = document.getElementById("computer-wake");
        var stop = document.getElementById("computer-stop");
        var wipe = document.getElementById("computer-wipe");
        if (wake) wake.addEventListener("click", function () { post("wake", "Будим…"); });
        if (stop) stop.addEventListener("click", function () { post("stop", "Выключаем…"); });
        if (wipe) wipe.addEventListener("click", function () { post("wipe", "Стираем диск…"); });
      }

      function bindChatgpt() {
        var connect = document.getElementById("chatgpt-connect");
        var disconnect = document.getElementById("chatgpt-disconnect");
        var st = document.getElementById("chatgpt-status");
        var code = document.getElementById("chatgpt-code");
        if (connect) {
          connect.addEventListener("click", function () {
            st.textContent = "Открываем вход…";
            if (code) { code.hidden = true; code.textContent = ""; }
            fetch(base + "/me/chatgpt/start", {
              method: "POST",
              headers: { Authorization: "Bearer " + t },
            })
              .then(function (res) { return res.json(); })
              .then(function (data) {
                if (!data.ok || !data.url || !data.userCode) {
                  st.textContent = "Не вышло, нажми ещё раз";
                  return;
                }
                var href = safeHttpUrl(data.url);
                st.textContent = "Открой ссылку и введи код. Bro сам проверит вход.";
                if (code) {
                  code.hidden = false;
                  code.textContent = (href || data.url) + "\n" + data.userCode;
                }
              })
              .catch(function () {
                st.textContent = "Не вышло, нажми ещё раз";
              });
          });
        }
        if (disconnect) {
          disconnect.addEventListener("click", function () {
            st.textContent = "Отключаем…";
            fetch(base + "/me/chatgpt/disconnect", {
              method: "POST",
              headers: { Authorization: "Bearer " + t },
            })
              .then(function (res) { return res.json(); })
              .then(function (data) {
                if (!data.ok) {
                  st.textContent = "Не вышло, нажми ещё раз";
                  return;
                }
                return loadMe().then(function (me) {
                  if (!me) return;
                  paint(me);
                });
              })
              .catch(function () {
                st.textContent = "Не вышло, нажми ещё раз";
              });
          });
        }
      }

      function loadMe() {
        return fetch(base + "/me", { headers: { Authorization: "Bearer " + t } })
          .then(function (res) { return res.json().then(function (data) { return { res: res, data: data }; }); })
          .then(function (got) {
            if (!got.res.ok || !got.data.ok) {
              localStorage.removeItem(TOKEN);
              boot.hidden = false;
              body.hidden = true;
              boot.textContent = "Сессия истекла. Войди снова.";
              document.getElementById("login-open").hidden = false;
              document.getElementById("logout").hidden = true;
              document.getElementById("cabinet-open").hidden = true;
              return null;
            }
            return got.data.me;
          });
      }

      loadMe()
        .then(function (me) {
          if (me) paint(me);
        })
        .catch(function () {
          boot.textContent = "Не вышло загрузить кабинет";
        });
    })();
  </script>
</body>
</html>
