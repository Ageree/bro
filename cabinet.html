<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>bro — кабинет</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/assets/bro-mark.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/bro-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prata&family=Onest:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/brand.css" />
</head>
<body>

  <header class="bar">
    <div><a class="link t-nav" id="vault-open" href="/vault.html">Сейф</a></div>
    <a class="link t-wordmark" href="/">bro.</a>
    <div>
      <button class="link t-nav" id="logout" type="button" style="background:none;border:0;cursor:pointer">Выйти</button>
      <button class="link t-nav" id="login-open" type="button" style="background:none;border:0;cursor:pointer" hidden>Войти</button>
    </div>
  </header>

  <div class="modal" id="login-modal" hidden>
    <div class="sheet" role="dialog" aria-labelledby="login-title">
      <h2 id="login-title">Вход в кабинет</h2>
      <p class="t-small t-mute">На компьютере введи handle. Код придёт сообщением от Bro в уже открытый чат iMessage.</p>
      <div id="login-handle-row" hidden>
        <label for="login-handle">Handle</label>
        <input id="login-handle" autocomplete="username" placeholder="bro-xxxxxxxx" />
      </div>
      <button class="btn sheet-cta" id="login-send" type="button">Получить код</button>
      <div id="login-code-row" hidden>
        <label for="login-code">Код из iMessage</label>
        <input id="login-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
        <button class="btn sheet-cta" id="login-verify" type="button">Войти</button>
      </div>
      <p class="status" id="login-status"></p>
      <button class="text-close" id="login-cancel" type="button">Закрыть</button>
    </div>
  </div>

  <main class="doc">
    <p class="t-small t-mute" id="boot">Загружаем…</p>
    <div id="body" hidden></div>
  </main>

  <script src="assets/config.js"></script>
  <script src="assets/auth.js"></script>
  <script>
    (function () {
      var TOKEN = "bro.session";
      function site() {
        var s = window.BRO_CONVEX_SITE_URL;
        return typeof s === "string" ? s.replace(/\/$/, "") : "";
      }
      function token() { return localStorage.getItem(TOKEN) || ""; }
      function esc(s) {
        return String(s).replace(/[&<>"]/g, function (c) {
          return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c];
        });
      }
      function pct(used, allow) {
        if (!allow) return 0;
        return Math.max(0, Math.min(100, Math.round((used / allow) * 100)));
      }
      /* Every section is the same shape: a serif heading with the current
         state set small and grey on the same line, then whatever the section
         has to say. No card, no border but the hairline above it. */
      function head(title, state) {
        return '<div class="sec__head">' + title +
          (state ? '<span class="sec__state">' + esc(state) + "</span>" : "") +
          "</div>";
      }
      function meter(used, allow) {
        return '<div class="meter"><i style="width:' + pct(used, allow) + '%"></i></div>';
      }
      var DEFAULT_TZ = "Europe/Moscow";
      var TZ_LIST = [
        "Europe/Moscow",
        "Europe/Samara",
        "Asia/Yekaterinburg",
        "Asia/Omsk",
        "Asia/Krasnoyarsk",
        "Asia/Irkutsk",
        "Asia/Yakutsk",
        "Asia/Vladivostok",
        "Asia/Magadan",
        "Asia/Kamchatka",
        "UTC",
      ];
      function zoneOf(me) {
        return (me && me.tz) || DEFAULT_TZ;
      }
      function when(ms, tz) {
        var zone = tz || DEFAULT_TZ;
        try {
          return new Date(ms).toLocaleString("ru-RU", { timeZone: zone });
        } catch (e) {
          return new Date(ms).toLocaleString("ru-RU", { timeZone: DEFAULT_TZ });
        }
      }
      function safeHttpUrl(u) {
        try {
          var x = new URL(u);
          if (x.protocol === "https:" || x.protocol === "http:") return x.toString();
        } catch (e) {}
        return "";
      }
      function tzOptions(current) {
        var list = TZ_LIST.slice();
        if (current && list.indexOf(current) === -1) list.push(current);
        return list.map(function (z) {
          return '<option value="' + esc(z) + '"' +
            (z === current ? " selected" : "") + ">" + esc(z) + "</option>";
        }).join("");
      }
      function computerStateRu(s) {
        if (!s || s === "none") return "нет компьютера";
        if (s === "pending") return "создаём";
        if (s === "ready" || s === "idle" || s === "running") return "работает";
        if (s === "archived" || s === "stopped" || s === "archiving") return "выключен";
        return s;
      }
      function chatgptStatusRu(s) {
        if (s === "connected") return "подключён";
        if (s === "pending") return "ждём вход";
        if (s === "quarantined") return "нужно войти снова";
        return "не подключён";
      }
      function computerCard(me) {
        var c = me.computer || { state: "none" };
        return '<section class="sec" id="computer">' +
          head("<h2>Компьютер</h2>", computerStateRu(c.state)) +
          '<div class="acts">' +
          '<button class="act" id="computer-wake" type="button">Разбудить</button>' +
          '<button class="act" id="computer-stop" type="button">Выключить</button>' +
          '<button class="act act--mute" id="computer-wipe" type="button">Стереть диск</button>' +
          "</div>" +
          '<p class="status-line" id="computer-status"></p></section>';
      }
      function chatgptCard(me) {
        var g = me.chatgpt || { status: "none" };
        var bits = "";
        if (g.email) bits += '<p class="t-small t-mute">' + esc(g.email) + "</p>";
        if (g.planType) bits += '<p class="t-small t-mute">' + esc(g.planType) + "</p>";
        bits += '<div class="acts">';
        if (g.status !== "connected") {
          bits += '<button class="act" id="chatgpt-connect" type="button">Подключить</button>';
        }
        if (g.status === "connected" || g.status === "quarantined" || g.status === "pending") {
          bits += '<button class="act" id="chatgpt-disconnect" type="button">Отключить</button>';
        }
        bits += "</div>" +
          '<p class="status-line" id="chatgpt-status"></p>' +
          '<p class="cmd" id="chatgpt-code" hidden></p>';
        return '<section class="sec" id="chatgpt">' +
          head("<h2>ChatGPT</h2>", chatgptStatusRu(g.status)) + bits + "</section>";
      }
      function nowCard(me) {
        var job = me.browserJob || { status: "", label: "Сейчас ничего не делает" };
        var live = safeHttpUrl(job.liveUrl || "");
        var bits = "";
        if (job.task) bits += '<p class="t-small t-mute">' + esc(job.task) + "</p>";
        if (job.startedAt) {
          bits += '<p class="t-small t-mute">' + esc(when(job.startedAt, zoneOf(me))) + "</p>";
        }
        if (live) {
          bits += '<div class="acts"><a class="act" id="browser-live" href="' +
            esc(live) + '" target="_blank" rel="noopener noreferrer">Открыть</a></div>';
        }
        return '<section class="sec" id="now">' +
          head("<h2>Сейчас</h2>", job.label) + bits + "</section>";
      }
      function tzCard(me) {
        var zone = zoneOf(me);
        return '<section class="sec" id="tz">' +
          '<div class="sec__head"><h2>Часовой пояс</h2></div>' +
          '<select class="field" id="tz-select" aria-label="Часовой пояс">' +
          tzOptions(zone) + "</select>" +
          '<p class="status-line" id="tz-status"></p></section>';
      }
      function statusRu(s) {
        if (s === "succeeded") return "оплачен";
        if (s === "pending") return "ожидает";
        return "отменён";
      }
      function profileStatusRu(s, domains) {
        if (s === "synced" && domains && domains.length) {
          return "Сохранены входы: " + esc(domains.join(", "));
        }
        return "Пока нет сохранённых входов — Bro пришлёт ссылку, когда понадобится.";
      }
      function vaultKindRu(k) {
        if (k === "payment") return "карта";
        if (k === "address") return "адрес";
        if (k === "contact") return "контакт";
        if (k === "login") return "вход";
        return k || "";
      }
      function vaultCard() {
        return '<section class="sec" id="vault">' +
          head("<h2>Сейф</h2>", "") +
          '<p class="t-small t-mute">Bro платит этой картой на сайтах. Номер и CVV он не видит — только заполняет форму оплаты.</p>' +
          '<ul class="rows" id="vault-items" hidden></ul>' +
          '<p class="t-small t-mute" id="vault-empty">Карты ещё нет — добавь, и Bro сможет покупать.</p>' +
          '<div class="acts">' +
          '<a class="act" id="vault-add-card" href="/vault.html?kind=payment&from=cabinet">Добавить карту</a>' +
          '<a class="act" id="vault-open-page" href="/vault.html">Открыть сейф</a>' +
          "</div></section>";
      }

      var HANDLE = "bro.handle";
      var boot = document.getElementById("boot");
      var body = document.getElementById("body");
      var t = token();
      var base = site();
      var memoLines = [];
      if (!t) {
        boot.textContent = "Войди, чтобы увидеть оплату и лимиты.";
        document.getElementById("login-open").click();
        return;
      }
      if (!base) {
        boot.textContent = "Сайт ещё не подключён";
        return;
      }

      function validHandle(h) {
        return /^bro-[a-z0-9]{8}$/.test(h || "");
      }
      function storedHandle() {
        var h = (localStorage.getItem(HANDLE) || "").trim();
        return validHandle(h) ? h : "";
      }

      function memoCard(me) {
        memoLines = me.memories || [];
        var items = memoLines.map(function (line, i) {
          return '<li><span class="row-main">' + esc(line) + "</span>" +
            '<button class="act act--sm act--mute row-side" type="button" data-i="' + i +
            '">Забыть</button></li>';
        }).join("");
        var empty = me.phoneBound
          ? "Пока пусто."
          : "Память появится, когда напишешь Bro в iMessage.";
        return '<section class="sec" id="memory">' +
          head("<h2>Память</h2>", "") +
          (items
            ? '<ul class="rows" id="memos">' + items + "</ul>"
            : '<p class="t-small t-mute">' + empty + "</p>") +
          '<p class="status-line" id="memory-status"></p></section>';
      }

      function bindPay() {
        var btn = document.getElementById("pay-now");
        if (!btn) return;
        btn.addEventListener("click", function () {
          var st = document.getElementById("pay-status");
          st.textContent = "Открываем ЮKassa…";
          fetch(base + "/me/pay", {
            method: "POST",
            headers: { Authorization: "Bearer " + t },
          })
            .then(function (res) { return res.json(); })
            .then(function (data) {
              if (data.ok && data.confirmationUrl) {
                window.location.href = data.confirmationUrl;
                return;
              }
              if (data.code === "billing_off") st.textContent = "Оплата скоро";
              else st.textContent = "Не вышло, нажми ещё раз";
            })
            .catch(function () {
              st.textContent = "Не вышло, нажми ещё раз";
            });
        });
      }

      function bindWrite(me) {
        var btn = document.getElementById("write-bro");
        if (!btn) return;
        btn.addEventListener("click", function () {
          var st = document.getElementById("write-status");
          var h = storedHandle() || (validHandle(me.handle) ? me.handle : "");
          if (h && !storedHandle()) localStorage.setItem(HANDLE, h);
          if (!h) {
            st.textContent = "Открой сайт на том же iPhone или нажми «Запросить доступ» ещё раз.";
            return;
          }
          if (btn.getAttribute("aria-busy") === "true") return;
          btn.setAttribute("aria-busy", "true");
          st.textContent = "Открываем Messages…";
          fetch(base + "/access", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ handle: h }),
          })
            .then(function (res) { return res.json(); })
            .then(function (data) {
              if (data.ok && data.smsLink) {
                window.location.href = data.smsLink;
                return;
              }
              st.textContent = "Не вышло, нажми ещё раз";
            })
            .catch(function () {
              st.textContent = "Не вышло, нажми ещё раз";
            })
            .then(function () {
              btn.removeAttribute("aria-busy");
            });
        });
      }

      function bindTz() {
        var sel = document.getElementById("tz-select");
        if (!sel) return;
        sel.addEventListener("change", function () {
          var tz = sel.value;
          var st = document.getElementById("tz-status");
          st.textContent = "Сохраняем…";
          fetch(base + "/me/tz", {
            method: "POST",
            headers: {
              Authorization: "Bearer " + t,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ tz: tz }),
          })
            .then(function (res) { return res.json(); })
            .then(function (data) {
              if (!data.ok) {
                st.textContent = "Не вышло, нажми ещё раз";
                return;
              }
              return loadMe().then(function (me) {
                if (!me) return;
                paint(me);
              });
            })
            .catch(function () {
              st.textContent = "Не вышло, нажми ещё раз";
            });
        });
      }

      function bindForget() {
        var list = document.getElementById("memos");
        if (!list) return;
        list.addEventListener("click", function (e) {
          var el = e.target;
          if (!el || !el.closest) return;
          var btn = el.closest("[data-i]");
          if (!btn) return;
          var i = Number(btn.getAttribute("data-i"));
          var needle = memoLines[i];
          if (!needle) return;
          var st = document.getElementById("memory-status");
          st.textContent = "Забываем…";
          fetch(base + "/me/memories/forget", {
            method: "POST",
            headers: {
              Authorization: "Bearer " + t,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ needle: needle }),
          })
            .then(function (res) { return res.json(); })
            .then(function (data) {
              if (!data.ok) {
                st.textContent = "Не вышло, нажми ещё раз";
                return;
              }
              return loadMe().then(function (me) {
                if (!me) return;
                paint(me);
              });
            })
            .catch(function () {
              st.textContent = "Не вышло, нажми ещё раз";
            });
        });
      }

      function paint(me) {
        var zone = zoneOf(me);
        var plan = me.plan === "paid" ? "Полный доступ" : "Бесплатный режим";
        var until = me.paidUntil
          ? "до " + when(me.paidUntil, zone)
          : "оплата ещё не оформлена";
        var phone = me.phoneBound
          ? "телефон …" + esc(me.phoneLast4 || "")
          : "телефон ещё не привязан — напиши Bro в iMessage";
        var pays = (me.payments || []).map(function (p) {
          return '<li><span class="row-main">' + esc(when(p.createdAt, zone)) +
            " · " + esc(p.amountRub) + " ₽</span>" +
            '<span class="row-side">' + esc(statusRu(p.status)) + "</span></li>";
        }).join("");
        body.innerHTML =
          '<h1 class="handle-xl">' + esc(me.handle) + "</h1>" +
          '<p class="t-small t-mute">' + esc(plan) + " · " + phone + "</p>" +
          '<p class="t-small t-mute">' + until + "</p>" +
          '<div class="acts">' +
          '<button class="act act--lead" id="write-bro" type="button">Написать Bro</button>' +
          '<button class="act act--lead" id="pay-now" type="button">Оплатить месяц</button>' +
          "</div>" +
          '<p class="status-line" id="write-status"></p>' +
          '<p class="status-line" id="pay-status"></p>' +
          nowCard(me) +
          computerCard(me) +
          chatgptCard(me) +
          '<section class="sec"><div class="sec__head"><h2>Лимиты</h2></div>' +
          '<p class="t-small t-mute">Сообщения сегодня — ' + me.msgsUsed + " из " + me.msgsAllowance + "</p>" +
          meter(me.msgsUsed, me.msgsAllowance) +
          '<p class="t-small t-mute">Браузер-задачи в этом месяце — ' + me.browserUsed + " из " + me.browserAllowance + "</p>" +
          meter(me.browserUsed, me.browserAllowance) + "</section>" +
          memoCard(me) +
          '<section class="sec" id="chrome"><div class="sec__head"><h2>Входы в сайты</h2></div>' +
          '<p class="t-small t-mute">Когда Bro нужна твоя учётка, он сам пришлёт ссылку в чат. Открой, войди — пароль он не увидит, вход сохранится.</p>' +
          '<p class="t-small" style="margin-top:0.6rem">' + profileStatusRu(me.browserProfileStatus, me.browserCookieDomains) + "</p></section>" +
          vaultCard() +
          tzCard(me) +
          '<section class="sec"><div class="sec__head"><h2>Оплаты</h2></div>' +
          (pays ? '<ul class="rows">' + pays + "</ul>" : '<p class="t-small t-mute">Пока нет оплат.</p>') +
          "</section>";
        boot.hidden = true;
        body.hidden = false;
        bindWrite(me);
        bindPay();
        bindForget();
        bindTz();
        bindComputer();
        bindChatgpt();
        bindVault();
      }

      function bindVault() {
        var list = document.getElementById("vault-items");
        var empty = document.getElementById("vault-empty");
        if (!list || !empty) return;
        fetch(base + "/vault/items", { headers: { Authorization: "Bearer " + t } })
          .then(function (res) {
            return res.json().then(function (data) { return { res: res, data: data }; });
          })
          .then(function (got) {
            if (got.res.status === 401 || (got.data && got.data.code === "unauthorized")) {
              empty.hidden = false;
              empty.textContent = "Сессия истекла. Войди снова.";
              return;
            }
            if (!got.res.ok || !got.data || !got.data.ok) {
              empty.hidden = false;
              empty.textContent = "Не вышло загрузить сейф";
              return;
            }
            var items = got.data.items || [];
            if (!items.length) {
              list.hidden = true;
              empty.hidden = false;
              empty.textContent = "Карты ещё нет — добавь, и Bro сможет покупать.";
              return;
            }
            empty.hidden = true;
            list.hidden = false;
            list.innerHTML = items.map(function (item) {
              var kind = vaultKindRu(item.kind);
              var hint = item.account || "";
              var line = item.label || kind;
              if (hint && hint !== line) line += " · " + hint;
              return "<li><span class=\"row-main\">" + esc(line) +
                "</span><span class=\"row-side\">" + esc(kind) + "</span></li>";
            }).join("");
          })
          .catch(function () {
            empty.hidden = false;
            empty.textContent = "Не вышло загрузить сейф";
          });
      }

      function bindComputer() {
        function post(action, label) {
          var st = document.getElementById("computer-status");
          if (action === "wipe" && !window.confirm("Стереть диск компьютера? Это нельзя отменить.")) {
            return;
          }
          st.textContent = label;
          fetch(base + "/me/computer", {
            method: "POST",
            headers: {
              Authorization: "Bearer " + t,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ action: action }),
          })
            .then(function (res) { return res.json(); })
            .then(function (data) {
              if (!data.ok) {
                st.textContent = "Не вышло, нажми ещё раз";
                return;
              }
              return loadMe().then(function (me) {
                if (!me) return;
                paint(me);
              });
            })
            .catch(function () {
              st.textContent = "Не вышло, нажми ещё раз";
            });
        }
        var wake = document.getElementById("computer-wake");
        var stop = document.getElementById("computer-stop");
        var wipe = document.getElementById("computer-wipe");
        if (wake) wake.addEventListener("click", function () { post("wake", "Будим…"); });
        if (stop) stop.addEventListener("click", function () { post("stop", "Выключаем…"); });
        if (wipe) wipe.addEventListener("click", function () { post("wipe", "Стираем диск…"); });
      }

      function bindChatgpt() {
        var connect = document.getElementById("chatgpt-connect");
        var disconnect = document.getElementById("chatgpt-disconnect");
        var st = document.getElementById("chatgpt-status");
        var code = document.getElementById("chatgpt-code");
        if (connect) {
          connect.addEventListener("click", function () {
            st.textContent = "Открываем вход…";
            if (code) { code.hidden = true; code.textContent = ""; }
            fetch(base + "/me/chatgpt/start", {
              method: "POST",
              headers: { Authorization: "Bearer " + t },
            })
              .then(function (res) { return res.json(); })
              .then(function (data) {
                if (!data.ok || !data.url || !data.userCode) {
                  st.textContent = "Не вышло, нажми ещё раз";
                  return;
                }
                var href = safeHttpUrl(data.url);
                st.textContent = "Открой ссылку и введи код. Bro сам проверит вход.";
                if (code) {
                  code.hidden = false;
                  code.textContent = (href || data.url) + "\n" + data.userCode;
                }
              })
              .catch(function () {
                st.textContent = "Не вышло, нажми ещё раз";
              });
          });
        }
        if (disconnect) {
          disconnect.addEventListener("click", function () {
            st.textContent = "Отключаем…";
            fetch(base + "/me/chatgpt/disconnect", {
              method: "POST",
              headers: { Authorization: "Bearer " + t },
            })
              .then(function (res) { return res.json(); })
              .then(function (data) {
                if (!data.ok) {
                  st.textContent = "Не вышло, нажми ещё раз";
                  return;
                }
                return loadMe().then(function (me) {
                  if (!me) return;
                  paint(me);
                });
              })
              .catch(function () {
                st.textContent = "Не вышло, нажми ещё раз";
              });
          });
        }
      }

      function loadMe() {
        return fetch(base + "/me", { headers: { Authorization: "Bearer " + t } })
          .then(function (res) { return res.json().then(function (data) { return { res: res, data: data }; }); })
          .then(function (got) {
            if (!got.res.ok || !got.data.ok) {
              localStorage.removeItem(TOKEN);
              boot.hidden = false;
              body.hidden = true;
              boot.textContent = "Сессия истекла. Войди снова.";
              document.getElementById("login-open").hidden = false;
              document.getElementById("logout").hidden = true;
              var vaultNav = document.getElementById("vault-open");
              if (vaultNav) vaultNav.hidden = true;
              return null;
            }
            return got.data.me;
          });
      }

      loadMe()
        .then(function (me) {
          if (me) paint(me);
        })
        .catch(function () {
          boot.textContent = "Не вышло загрузить кабинет";
        });
    })();
  </script>
</body>
</html>
