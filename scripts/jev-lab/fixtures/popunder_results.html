<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Поиск билетов…</title>
    <style>
      body {
        margin: 0;
        font:
          15px/1.4 Arial,
          sans-serif;
        background: #e8f1ff;
      }
      header {
        height: 56px;
        display: flex;
        align-items: center;
        padding: 0 32px;
        font-weight: 700;
        font-size: 20px;
        background: #0c73fe;
        color: #fff;
      }
      main {
        max-width: 900px;
        margin: 0 auto;
        padding: 18px 16px;
      }
      .ticket {
        background: #fff;
        border-radius: 10px;
        padding: 14px 18px;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
      }
    </style>
  </head>
  <body>
    <header>Летим</header>
    <main>
      <h1 id="h">Ищем билеты…</h1>
      <div id="list"></div>
    </main>
    <script>
      const q = new URLSearchParams(location.search);
      const from = q.get("from") || "",
        to = q.get("to") || "",
        date = q.get("date") || "";
      setTimeout(() => {
        const ok =
          /моск|moscow/i.test(from) &&
          /соч|sochi/i.test(to) &&
          date === "2026-10-16";
        document.title =
          (ok ? "PASS - " : "") + `Билеты ${from} — ${to}, ${date}`;
        document.getElementById("h").textContent = `${from} — ${to}, ${date}`;
        document.getElementById("list").innerHTML = [
          ["06:05 → 10:15", "5 230 ₽"],
          ["12:40 → 16:50", "6 120 ₽"],
          ["21:15 → 01:25", "4 870 ₽"],
        ]
          .map(
            (r) =>
              `<div class="ticket"><span>${r[0]}</span><span>${r[1]}</span></div>`
          )
          .join("");
      }, 400);
    </script>
  </body>
</html>
