<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Расписание электричек и поездов</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          15px/1.4 Arial,
          sans-serif;
        color: #000;
        background: #f2f2f2;
      }
      header {
        background: #fff;
        height: 56px;
        display: flex;
        align-items: center;
        gap: 28px;
        padding: 0 32px;
      }
      header .logo {
        font-weight: 700;
        font-size: 20px;
      }
      main {
        max-width: 1060px;
        margin: 0 auto;
        padding: 24px 16px;
      }
      h1 {
        font-size: 28px;
        margin: 8px 0 18px;
      }
      .form {
        display: flex;
        gap: 2px;
        background: #fc0;
        padding: 4px;
        border-radius: 12px;
      }
      .box {
        background: #fff;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 6px 14px;
        height: 60px;
        flex: 1;
      }
      .box .cap {
        font-size: 12px;
        color: #888;
      }
      .box input {
        border: 0;
        outline: 0;
        font: inherit;
        font-size: 17px;
        padding: 0;
        width: 100%;
      }
      .when {
        flex: 0.7;
      }
      .find {
        background: #fff;
        border: 0;
        border-radius: 8px;
        padding: 0 28px;
        font: 700 17px Arial;
        cursor: pointer;
      }
      .popular {
        margin-top: 18px;
      }
      .popular h2 {
        font-size: 17px;
        margin: 0 0 10px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        background: #fff;
        border: 0;
        border-radius: 18px;
        padding: 8px 14px;
        font: inherit;
        cursor: pointer;
      }
      .chip:hover {
        background: #fff3c4;
      }
      .err {
        color: #d00;
        margin-top: 10px;
        min-height: 20px;
      }
      #results {
        margin-top: 18px;
      }
      .train {
        background: #fff;
        border-radius: 10px;
        padding: 12px 18px;
        margin-bottom: 8px;
        display: grid;
        grid-template-columns: 1fr 2fr 1fr 1fr;
      }
      .muted {
        color: #888;
      }
    </style>
  </head>
  <body>
    <header><span class="logo">Расписания</span></header>
    <main>
      <h1>Расписание поездов и электричек</h1>
      <div class="form">
        <label class="box"
          ><span class="cap">Откуда</span
          ><input id="from" aria-label="Откуда" autocomplete="off"
        /></label>
        <label class="box"
          ><span class="cap">Куда</span
          ><input id="to" aria-label="Куда" autocomplete="off"
        /></label>
        <label class="box when"
          ><span class="cap">Когда</span
          ><input id="when" aria-label="Когда" value="на все дни" readonly
        /></label>
        <button class="find" id="find" type="button">Найти</button>
      </div>
      <div class="err" id="err"></div>
      <section class="popular" id="popular">
        <h2>Популярные направления</h2>
        <div class="chips" id="chips"></div>
      </section>
      <div id="results"></div>
    </main>
    <script>
      (() => {
        const ROUTES = [
          ["Москва", "Санкт-Петербург"],
          ["Санкт-Петербург", "Москва"],
          ["Москва", "Тверь"],
          ["Москва", "Нижний Новгород"],
          ["Москва", "Казань"],
          ["Москва", "Сергиев Посад"],
          ["Санкт-Петербург", "Великий Новгород"],
          ["Москва", "Владимир"],
        ];
        const from = document.getElementById("from"),
          to = document.getElementById("to");
        let typed = false,
          submitted = false;
        const edited = () => {
          if (submitted) {
            submitted = false;
            document.title = "Расписание электричек и поездов";
            document.getElementById("results").innerHTML = "";
          }
        };
        // A chip only fills the two fields; the schedule opens after "Найти".
        for (const [a, b] of ROUTES) {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "chip";
          chip.textContent = `${a} — ${b}`;
          chip.addEventListener("click", () => {
            from.value = a;
            to.value = b;
            typed = false;
            edited();
          });
          document.getElementById("chips").appendChild(chip);
        }
        for (const f of [from, to])
          f.addEventListener("input", () => {
            typed = true;
            edited();
          });
        document.getElementById("find").addEventListener("click", () => {
          const err = document.getElementById("err"),
            results = document.getElementById("results");
          if (!from.value.trim() || !to.value.trim()) {
            err.textContent = "Укажите пункты отправления и прибытия";
            return;
          }
          err.textContent = "";
          submitted = true;
          const ok =
            !typed && from.value === "Москва" && to.value === "Санкт-Петербург";
          document.title = ok
            ? "PASS - расписание Москва — Санкт-Петербург"
            : `Расписание: ${from.value} — ${to.value}`;
          history.replaceState(
            null,
            "",
            `?fromName=${encodeURIComponent(from.value)}&toName=${encodeURIComponent(to.value)}`
          );
          document.getElementById("popular").hidden = true;
          results.innerHTML = '<p class="muted">Загружаем расписание…</p>';
          setTimeout(() => {
            if (!submitted) return;
            results.innerHTML =
              `<h2>${from.value} — ${to.value}, на все дни</h2>` +
              [
                ["05:40", "Сапсан 750А", "3 ч 59 мин", "ежедневно"],
                ["07:00", "Сапсан 752А", "3 ч 55 мин", "ежедневно"],
                ["13:30", "Сапсан 766А", "4 ч 00 мин", "ежедневно"],
                ["23:55", "Красная стрела 002А", "8 ч 55 мин", "ежедневно"],
              ]
                .map(
                  (r) =>
                    `<div class="train"><b>${r[0]}</b><span>${r[1]}</span><span>${r[2]}</span><span class="muted">${r[3]}</span></div>`
                )
                .join("");
          }, 300);
        });
      })();
    </script>
  </body>
</html>
