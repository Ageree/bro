<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Отели в Казани на карте</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font:
          14px/1.4 Arial,
          sans-serif;
        color: #222;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      header {
        flex: none;
        height: 56px;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 20px;
        border-bottom: 1px solid #e3e3e3;
        background: #fff;
      }
      header .logo {
        font-weight: 700;
        font-size: 19px;
        color: #0b5cad;
      }
      header .q {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 6px 12px;
        color: #444;
      }
      .shell {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .list {
        width: 400px;
        flex: none;
        overflow-y: auto;
        border-right: 1px solid #e3e3e3;
        background: #fff;
      }
      .list .count {
        padding: 12px 16px;
        color: #666;
        border-bottom: 1px solid #eee;
      }
      .hotel {
        display: flex;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid #eee;
      }
      .hotel .ph {
        width: 92px;
        height: 78px;
        border-radius: 8px;
        background: linear-gradient(135deg, #cfe3f7, #e9f1fa);
        flex: none;
      }
      .hotel .name {
        font-weight: 700;
        font-size: 15px;
        color: #0b5cad;
        background: none;
        border: 0;
        padding: 0;
        text-align: left;
        cursor: pointer;
        font-family: inherit;
      }
      .hotel .meta {
        color: #666;
        font-size: 13px;
      }
      .hotel .price {
        font-weight: 700;
        margin-top: 4px;
      }
      .map {
        flex: 1;
        position: relative;
        background: repeating-linear-gradient(
          45deg,
          #eef3e8 0 22px,
          #e6eddf 22px 44px
        );
        overflow: hidden;
      }
      .map .pin {
        position: absolute;
        background: #fff;
        border-radius: 12px;
        padding: 2px 8px;
        font-size: 12px;
        font-weight: 700;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      }
      .map .zoom {
        position: absolute;
        right: 14px;
        top: 14px;
        background: #fff;
        border-radius: 8px;
        padding: 6px 10px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        color: #666;
      }
      .drawer {
        position: absolute;
        inset: 0 0 0 auto;
        width: 420px;
        background: #fff;
        box-shadow: -4px 0 16px rgba(0, 0, 0, 0.15);
        padding: 20px;
      }
      .drawer[hidden] {
        display: none;
      }
      .drawer h2 {
        margin: 0 0 8px;
      }
      .drawer button {
        border: 0;
        background: #eee;
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="logo">Отели.Поиск</span
      ><span class="q">Казань · 12–15 ноября · 2 гостя</span>
    </header>
    <div class="shell">
      <section class="list" id="list" aria-label="Список отелей">
        <div class="count">Найдено 30 вариантов</div>
      </section>
      <div class="map" id="map">
        <div class="zoom">Масштаб: колесо мыши</div>
        <div id="pins"></div>
        <aside class="drawer" id="drawer" hidden>
          <h2 id="d-name"></h2>
          <div id="d-meta"></div>
          <p id="d-desc"></p>
          <button type="button" id="d-close">Закрыть</button>
        </aside>
      </div>
    </div>
    <script>
      (() => {
        const NAMES = [
          "Казань Сити",
          "Ривьера",
          "Кремлёвская",
          "Номера на Баумана",
          "Тасиго",
          "Регина на Петербургской",
          "Мираж",
          "Сулейман Палас",
          "Ногай",
          "Гранд Отель Казань",
          "Хостел Слобода",
          "Апартаменты у Кремля",
          "Татарстан",
          "Амакс Сафар",
          "Волга",
          "Ибис Казань Центр",
          "Корстон",
          "Европа",
          "Джузеппе",
          "Бусинка",
          "Каштан",
          "Шаляпин Палас",
          "Давыдов",
          "Биляр Палас",
          "Сафар Отель",
          "Ногай Резиденс",
          "Камелот",
          "Старая Казань",
          "Мини-отель Кремль",
          "Луна",
        ];
        const list = document.getElementById("list"),
          pins = document.getElementById("pins");
        NAMES.forEach((name, i) => {
          const price = 4200 + ((i * 1370) % 9100);
          const rating = (7.6 + ((i * 7) % 23) / 10).toFixed(1);
          const item = document.createElement("article");
          item.className = "hotel";
          item.innerHTML = `<div class="ph"></div><div><button type="button" class="name"></button>
      <div class="meta">${3 + (i % 3)} звезды · ${rating} · ${(0.4 + (i % 9) * 0.35).toFixed(1)} км от центра</div>
      <div class="price">${price.toLocaleString("ru-RU")} ₽ за 3 ночи</div></div>`;
          item.querySelector(".name").textContent = name;
          item
            .querySelector(".name")
            .addEventListener("click", () => show(name, i, price, rating));
          list.appendChild(item);
          if (i < 12) {
            // the map shows a dozen price pins (decoration, not links)
            const pin = document.createElement("div");
            pin.className = "pin";
            pin.style.left = 40 + ((i * 97) % 560) + "px";
            pin.style.top = 60 + ((i * 131) % 520) + "px";
            pin.textContent = Math.round(price / 100) / 10 + " тыс ₽";
            pins.appendChild(pin);
          }
        });
        // The map captures the wheel for zooming, so scrolling over it never scrolls the page or the list.
        document
          .getElementById("map")
          .addEventListener("wheel", (e) => e.preventDefault(), {
            passive: false,
          });
        function show(name, i, price, rating) {
          document.getElementById("d-name").textContent = name;
          document.getElementById("d-meta").textContent =
            `Рейтинг ${rating} · ${price.toLocaleString("ru-RU")} ₽ за 3 ночи`;
          document.getElementById("d-desc").textContent =
            "Номера с завтраком, бесплатный Wi-Fi, парковка. Заезд с 14:00, выезд до 12:00.";
          document.getElementById("drawer").hidden = false;
          document.title =
            name === "Шаляпин Палас"
              ? "PASS - открыт отель Шаляпин Палас"
              : `${name} — отель в Казани`;
        }
        document.getElementById("d-close").addEventListener("click", () => {
          document.getElementById("drawer").hidden = true;
          document.title = "Отели в Казани на карте";
        });
      })();
    </script>
  </body>
</html>
